name: Validations

on:
  push:
    branches: [main]
  pull_request:

jobs:
  Static-Analysis:
    name: "Static analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap environment
        uses: ./.github/actions/bootstrap
        with:
          go-version: "1.24.x"

      - name: Vet
        run: make vet

      - name: Format check
        run: make fmt-check

      - name: Go mod tidy check
        run: make check-go-mod-tidy

      - name: License check
        run: make check-licenses

  Unit-Test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap environment
        uses: ./.github/actions/bootstrap
        with:
          go-version: "1.24.x"

      - name: Unit tests
        run: make unit
